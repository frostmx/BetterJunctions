[AccessTransformers]
; The reservation logic and the subsystem tick are protected. The hooks class needs them by
; name to subscribe, and the watchdog reads the stop target and the reservation map directly.
Friend=(Class="UFGVehicleAutopilotComponent", FriendClass="FBetterJunctionsHooks")
Friend=(Class="AFGVehicleSubsystem", FriendClass="FBetterJunctionsHooks")
; BJ.Blocks / BJ.Purge read the per-block reservation arrays under the segment's own lock.
Friend=(Class="AFGVehiclePathSegment", FriendClass="FBetterJunctionsHooks")
